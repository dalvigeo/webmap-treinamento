<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMap de Treinamento</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>

  <style>
    :root{
      --green:#236b3a;
      --green-dark:#174b29;
      --panel:#fff;
      --line:#d5ddd7;
      --text:#18211a;
      --muted:#617066;
      --shadow:0 3px 14px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:#e7ebe8;
    }

    body{
      display:flex;
      flex-direction:column;
    }

    header{
      min-height:54px;
      display:flex;
      align-items:center;
      gap:14px;
      padding:7px 12px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      z-index:30;
    }

    .brand{
      min-width:210px;
      flex:1 1 auto;
    }

    .brand h1{
      margin:0;
      font-size:18px;
      line-height:1.15;
    }

    .brand p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:11px;
    }

    .draw-tools{
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      justify-content:flex-end;
    }

    button,select,input{
      font:inherit;
    }

    button{
      min-height:34px;
      border:1px solid var(--line);
      border-radius:7px;
      background:#fff;
      color:var(--text);
      padding:5px 9px;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{background:#f2f6f3}

    button.active{
      color:#fff;
      background:var(--green);
      border-color:var(--green);
    }

    button.danger{color:#8a2929}

    .map-shell{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }

    #map{
      position:absolute;
      inset:0;
      background:#e8ece9;
    }

    .floating-panel{
      position:absolute;
      z-index:20;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(180,190,182,.9);
      border-radius:9px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(3px);
    }

    .layers-panel{
      top:10px;
      left:10px;
      width:225px;
      overflow:hidden;
    }

    .panel-title{
      width:100%;
      min-height:36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:0;
      border-radius:0;
      padding:7px 10px;
      background:#fff;
      text-align:left;
      font-size:12px;
    }

    .panel-title:hover{background:#f5f7f5}

    .panel-title .arrow{
      font-size:11px;
      transition:transform .16s ease;
    }

    .layers-panel.collapsed .panel-title .arrow{
      transform:rotate(-90deg);
    }

    .layers-panel.collapsed .layer-content{
      display:none;
    }

    .layer-content{
      padding:5px 9px 8px;
      border-top:1px solid #edf0ed;
    }

    .layer-row{
      display:flex;
      align-items:center;
      gap:7px;
      min-height:31px;
      font-size:12px;
      cursor:pointer;
    }

    .layer-row input{margin:0}

    .layer-sub{
      padding-left:22px;
      color:var(--muted);
      font-size:11px;
    }

    .service-status{
      margin-top:5px;
      padding-top:5px;
      border-top:1px solid #edf0ed;
      color:var(--muted);
      font-size:10px;
      line-height:1.25;
    }

    .base-panel{
      left:10px;
      bottom:72px;
      width:150px;
      height:150px;
      padding:9px;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .base-panel strong{
      font-size:11px;
    }

    .base-panel select{
      width:100%;
      min-height:34px;
      border:1px solid var(--line);
      border-radius:7px;
      padding:4px 6px;
      background:#fff;
      font-size:11px;
    }

    .base-preview{
      flex:1;
      min-height:0;
      border-radius:6px;
      border:1px solid #d5dbd6;
      background:
        linear-gradient(135deg,rgba(0,0,0,.06),rgba(255,255,255,.1)),
        #dde5df;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#536158;
      font-size:10px;
      line-height:1.25;
      padding:5px;
    }

    .base-extra{
      display:none;
      gap:4px;
      align-items:center;
      font-size:9px;
      color:var(--muted);
    }

    .base-extra.visible{display:flex}

    .base-extra input[type="range"]{
      width:65px;
    }

    .bottom-dock{
      position:absolute;
      z-index:22;
      left:170px;
      right:10px;
      bottom:10px;
      min-height:52px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 7px;
      background:rgba(255,255,255,.97);
      border:1px solid rgba(180,190,182,.9);
      border-radius:9px;
      box-shadow:var(--shadow);
      font-size:10px;
      overflow-x:auto;
      overflow-y:hidden;
      white-space:nowrap;
    }

    .search-group{
      display:flex;
      align-items:center;
      gap:4px;
      min-width:max-content;
      padding-right:7px;
      border-right:1px solid #e1e6e2;
    }

    .search-group:last-child{
      border-right:0;
      padding-right:0;
    }

    .search-group strong{
      font-size:10px;
    }

    .bottom-dock select,
    .bottom-dock input{
      height:30px;
      border:1px solid #cad4cc;
      border-radius:6px;
      padding:4px 6px;
      background:#fff;
      color:var(--text);
      font-size:10px;
    }

    .bottom-dock button{
      min-height:30px;
      height:30px;
      padding:3px 8px;
      font-size:10px;
    }

    .coord-input{width:100px}
    #queryValue{width:195px}

    .dock-status{
      min-width:48px;
      max-width:125px;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--muted);
      font-size:9px;
    }

    .map-status{
      position:absolute;
      z-index:12;
      right:10px;
      bottom:70px;
      padding:4px 7px;
      border-radius:6px;
      background:rgba(255,255,255,.88);
      color:#526057;
      font-size:9px;
      box-shadow:0 1px 4px rgba(0,0,0,.12);
      pointer-events:none;
    }

    .info-panel{
      display:none;
      position:absolute;
      z-index:25;
      right:10px;
      top:10px;
      width:min(350px,calc(100% - 255px));
      max-height:340px;
      overflow:auto;
      background:rgba(255,255,255,.98);
      border:1px solid var(--line);
      border-radius:9px;
      padding:11px;
      box-shadow:var(--shadow);
      font-size:11px;
    }

    .info-panel h3{
      margin:0 24px 7px 0;
      font-size:14px;
    }

    .info-panel .close{
      position:absolute;
      top:5px;
      right:5px;
      width:28px;
      min-height:28px;
      border:0;
      background:transparent;
      padding:0;
      font-size:18px;
    }

    .info-panel table{
      width:100%;
      border-collapse:collapse;
      font-size:10px;
    }

    .info-panel td{
      padding:4px 3px;
      border-bottom:1px solid #edf0ed;
      vertical-align:top;
      word-break:break-word;
    }

    .info-panel td:first-child{
      width:40%;
      font-weight:700;
    }

    .measure-tooltip{
      position:relative;
      background:rgba(20,38,25,.86);
      color:#fff;
      padding:5px 8px;
      border-radius:6px;
      font-size:11px;
      font-weight:bold;
      white-space:nowrap;
      pointer-events:none;
    }

    .error{
      display:none;
      position:absolute;
      z-index:50;
      left:50%;
      top:8px;
      transform:translateX(-50%);
      max-width:min(650px,calc(100% - 20px));
      padding:7px 10px;
      background:#fff2f2;
      border:1px solid #e3baba;
      border-radius:7px;
      color:#8a2929;
      font-size:11px;
      box-shadow:var(--shadow);
    }

    [hidden]{display:none!important}

    @media(max-width:850px){
      header{
        min-height:auto;
        align-items:flex-start;
      }

      .brand p{display:none}

      .draw-tools{
        flex:0 1 62%;
      }

      .draw-tools button{
        min-height:32px;
        font-size:10px;
        padding:4px 7px;
      }

      .layers-panel{
        width:190px;
      }

      .info-panel{
        width:min(320px,calc(100% - 215px));
      }

      .bottom-dock{
        left:10px;
        bottom:8px;
      }

      .base-panel{
        bottom:70px;
        width:132px;
        height:132px;
      }

      .map-status{
        bottom:68px;
      }
    }

    @media(max-width:560px){
      header{
        display:block;
        padding:7px 8px;
      }

      .brand h1{
        font-size:15px;
        margin-bottom:5px;
      }

      .draw-tools{
        justify-content:flex-start;
        gap:3px;
      }

      .draw-tools button{
        min-height:29px;
        font-size:9px;
      }

      .layers-panel{
        top:8px;
        left:8px;
        width:175px;
      }

      .base-panel{
        left:8px;
        bottom:90px;
        width:122px;
        height:122px;
        padding:7px;
      }

      .bottom-dock{
        left:8px;
        right:8px;
        bottom:8px;
        min-height:70px;
        align-items:flex-start;
      }

      .info-panel{
        top:8px;
        right:8px;
        width:calc(100% - 199px);
        min-width:150px;
        max-height:270px;
      }

      .map-status{
        right:8px;
        bottom:86px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>WebMap de Treinamento</h1>
      <p>OpenLayers · WMS · WFS · XYZ · processamento local</p>
    </div>

    <div class="draw-tools" aria-label="Ferramentas de desenho">
      <button id="btnNavigate" class="active" type="button">Navegar</button>
      <button id="btnPoint" type="button">Ponto</button>
      <button id="btnLine" type="button">Linha</button>
      <button id="btnPolygon" type="button">Polígono</button>
      <button id="btnClear" class="danger" type="button">Limpar</button>
    </div>
  </header>

  <main class="map-shell">
    <div id="error" class="error"></div>
    <div id="map"></div>

    <section id="layersPanel" class="floating-panel layers-panel" aria-label="Camadas vetoriais">
      <button id="layersToggle" class="panel-title" type="button" aria-expanded="true">
        <span><strong>Camadas vetoriais</strong></span>
        <span class="arrow">▼</span>
      </button>
      <div class="layer-content">
        <label class="layer-row">
          <input id="toggleMunicipios" type="checkbox" checked>
          <span>Limite municipal</span>
        </label>
        <label class="layer-row">
          <input id="toggleSicar" type="checkbox" checked>
          <span>Imóveis SICAR</span>
        </label>
        <label class="layer-row layer-sub">
          <input id="toggleLabels" type="checkbox" checked>
          <span>Rótulos SICAR</span>
        </label>
        <div id="serviceStatus" class="service-status">Serviços prontos.</div>
      </div>
    </section>

    <section class="floating-panel base-panel" aria-label="Mapa base">
      <strong>Mapa base</strong>
      <select id="baseSelect" aria-label="Selecionar mapa base">
        <option value="google" selected>Google Satellite</option>
        <option value="ortho">Ortofoto 2012/2015</option>
        <option value="osm">OpenStreetMap</option>
      </select>
      <div id="basePreview" class="base-preview">Google Satellite<br><small>XYZ experimental</small></div>
      <div id="orthoExtra" class="base-extra">
        <span>Opac.</span>
        <input id="orthoOpacity" type="range" min="0" max="1" step="0.05" value="1">
      </div>
    </section>

    <section class="bottom-dock" aria-label="Barra de buscas">
      <div class="search-group">
        <strong>Coordenadas</strong>
        <select id="coordMode" aria-label="Sistema de coordenadas">
          <option value="decimal">Grau decimal</option>
          <option value="utm">UTM 24S</option>
        </select>

        <span id="decimalFields">
          <input id="latInput" class="coord-input" inputmode="decimal" placeholder="Lat. -19,50" aria-label="Latitude">
          <input id="lonInput" class="coord-input" inputmode="decimal" placeholder="Long. -40,50" aria-label="Longitude">
        </span>

        <span id="utmFields" hidden>
          <input id="eastInput" class="coord-input" inputmode="decimal" placeholder="E 350000" aria-label="Coordenada Este">
          <input id="northInput" class="coord-input" inputmode="decimal" placeholder="N 7840000" aria-label="Coordenada Norte">
        </span>

        <button id="btnFindCoord" type="button">Ir</button>
        <span id="coordSearchStatus" class="dock-status"></span>
      </div>

      <div class="search-group">
        <strong>Buscar atributo</strong>
        <select id="queryLayer" aria-label="Camada">
          <option value="sicar">Imóveis SICAR</option>
          <option value="municipios">Limite municipal</option>
        </select>
        <select id="queryField" aria-label="Campo"></select>
        <input id="queryValue" autocomplete="off" placeholder="Valor" aria-label="Valor para busca">
        <button id="btnFindAttribute" type="button">Buscar</button>
        <span id="queryStatus" class="dock-status"></span>
      </div>
    </section>

    <div id="mapStatus" class="map-status">Lat — · Lon —</div>
    <aside id="infoPanel" class="info-panel"></aside>
  </main>

  <script>
    (function(){
      const errorBox=document.getElementById('error');
      const serviceStatus=document.getElementById('serviceStatus');
      const infoPanel=document.getElementById('infoPanel');
      const toggleMunicipios=document.getElementById('toggleMunicipios');
      const toggleSicar=document.getElementById('toggleSicar');
      const toggleLabels=document.getElementById('toggleLabels');
      const layersPanel=document.getElementById('layersPanel');
      const layersToggle=document.getElementById('layersToggle');
      const baseSelect=document.getElementById('baseSelect');
      const basePreview=document.getElementById('basePreview');
      const orthoExtra=document.getElementById('orthoExtra');
      const orthoOpacity=document.getElementById('orthoOpacity');
      const coordMode=document.getElementById('coordMode');
      const decimalFields=document.getElementById('decimalFields');
      const utmFields=document.getElementById('utmFields');
      const coordSearchStatus=document.getElementById('coordSearchStatus');
      const latInput=document.getElementById('latInput');
      const lonInput=document.getElementById('lonInput');
      const eastInput=document.getElementById('eastInput');
      const northInput=document.getElementById('northInput');
      const queryLayer=document.getElementById('queryLayer');
      const queryField=document.getElementById('queryField');
      const queryValue=document.getElementById('queryValue');
      const queryStatus=document.getElementById('queryStatus');
      const mapStatus=document.getElementById('mapStatus');

      function showError(message){
        errorBox.style.display='block';
        errorBox.textContent=message;
        window.setTimeout(function(){errorBox.style.display='none';},5000);
      }

      function parseNumber(value){
        return Number(String(value).trim().replace(',','.'));
      }

      function escapeHtml(value){
        return String(value)
          .replaceAll('&','&amp;')
          .replaceAll('<','&lt;')
          .replaceAll('>','&gt;')
          .replaceAll('"','&quot;')
          .replaceAll("'","&#039;");
      }

      function cqlQuote(value){
        return String(value).replaceAll("'","''");
      }

      if(typeof ol==='undefined'){
        showError('Erro ao carregar o OpenLayers.');
        return;
      }

      if(typeof proj4==='undefined'){
        showError('Erro ao carregar o Proj4js. A busca UTM ficará indisponível.');
      }else{
        proj4.defs('EPSG:4674','+proj=longlat +ellps=GRS80 +no_defs +type=crs');
        proj4.defs('EPSG:31984','+proj=utm +zone=24 +south +ellps=GRS80 +units=m +no_defs +type=crs');
      }

      try{
        const osmLayer=new ol.layer.Tile({
          source:new ol.source.OSM(),
          visible:false,
          zIndex:0
        });

        const orthoSource=new ol.source.TileWMS({
          url:'https://ide.geobases.es.gov.br/geoserver/ows',
          params:{
            'LAYERS':'geonode:iema_ortofotomosaico_es_025m_2012-2015',
            'FORMAT':'image/png',
            'TILED':true
          },
          serverType:'geoserver',
          transition:0
        });

        const orthoLayer=new ol.layer.Tile({
          source:orthoSource,
          visible:false,
          opacity:1,
          zIndex:0
        });

        const googleSource=new ol.source.XYZ({
          url:'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
          minZoom:0,
          maxZoom:19,
          transition:0
        });

        const googleLayer=new ol.layer.Tile({
          source:googleSource,
          visible:true,
          zIndex:0
        });

        const municipiosSource=new ol.source.TileWMS({
          url:'https://ide.geobases.es.gov.br/geoserver/ows',
          params:{
            'LAYERS':'geonode:idaf_limite_municipal_2018_11',
            'FORMAT':'image/png',
            'TRANSPARENT':true,
            'TILED':true
          },
          serverType:'geoserver',
          transition:0
        });

        const municipiosLayer=new ol.layer.Tile({
          source:municipiosSource,
          visible:true,
          zIndex:5
        });

        const sicarSource=new ol.source.Vector({
          format:new ol.format.GeoJSON(),
          url:function(extent){
            const params=new URLSearchParams({
              service:'WFS',
              version:'2.0.0',
              request:'GetFeature',
              typeNames:'sicar:sicar_imoveis_es',
              outputFormat:'application/json',
              srsName:'EPSG:3857',
              count:'10000',
              bbox:extent.join(',')+',EPSG:3857'
            });
            return 'https://geoserver.car.gov.br/geoserver/sicar/wfs?'+params.toString();
          },
          strategy:ol.loadingstrategy.bbox
        });

        let map=null;

        function sicarStyle(feature){
          const cod=String(feature.get('cod_imovel')||'');
          const area=Number(feature.get('area'));
          let label='';

          if(toggleLabels.checked && map && map.getView().getZoom()>=14){
            label='Sicar: ...'+(cod ? cod.slice(-5) : '-----');
            if(Number.isFinite(area)){
              label+='\n'+area.toLocaleString('pt-BR',{
                minimumFractionDigits:2,
                maximumFractionDigits:2
              })+' ha';
            }
          }

          return new ol.style.Style({
            fill:new ol.style.Fill({color:'rgba(251,154,153,0.30)'}),
            stroke:new ol.style.Stroke({color:'rgba(255,127,0,0.95)',width:1}),
            text:label ? new ol.style.Text({
              text:label,
              font:'10px Arial',
              fill:new ol.style.Fill({color:'#000'}),
              stroke:new ol.style.Stroke({color:'#fff',width:3}),
              overflow:false
            }) : undefined
          });
        }

        const sicarLayer=new ol.layer.Vector({
          source:sicarSource,
          style:sicarStyle,
          minZoom:12,
          zIndex:10,
          renderOrder:function(a,b){
            return Number(b.get('area')||0)-Number(a.get('area')||0);
          }
        });

        const searchSource=new ol.source.Vector();
        const searchLayer=new ol.layer.Vector({
          source:searchSource,
          zIndex:18,
          style:function(feature){
            if(feature.get('searchType')==='coordinate'){
              return new ol.style.Style({
                image:new ol.style.Circle({
                  radius:9,
                  fill:new ol.style.Fill({color:'rgba(255,255,255,.95)'}),
                  stroke:new ol.style.Stroke({color:'#d52020',width:4})
                })
              });
            }

            return new ol.style.Style({
              fill:new ol.style.Fill({color:'rgba(255,235,59,.16)'}),
              stroke:new ol.style.Stroke({color:'#e00000',width:4})
            });
          }
        });

        const drawSource=new ol.source.Vector();
        const drawLayer=new ol.layer.Vector({
          source:drawSource,
          zIndex:20,
          style:new ol.style.Style({
            fill:new ol.style.Fill({color:'rgba(35,107,58,.20)'}),
            stroke:new ol.style.Stroke({color:'#236b3a',width:3}),
            image:new ol.style.Circle({
              radius:6,
              fill:new ol.style.Fill({color:'#236b3a'}),
              stroke:new ol.style.Stroke({color:'#fff',width:2})
            })
          })
        });

        map=new ol.Map({
          target:'map',
          layers:[
            osmLayer,
            orthoLayer,
            googleLayer,
            municipiosLayer,
            sicarLayer,
            searchLayer,
            drawLayer
          ],
          view:new ol.View({
            center:ol.proj.fromLonLat([-40.5,-19.6]),
            zoom:8
          })
        });

        let drawInteraction=null;
        let measureOverlay=null;

        const buttons={
          navigate:document.getElementById('btnNavigate'),
          point:document.getElementById('btnPoint'),
          line:document.getElementById('btnLine'),
          polygon:document.getElementById('btnPolygon')
        };

        const searchDefinitions={
          sicar:{
            label:'Imóveis SICAR',
            url:'https://geoserver.car.gov.br/geoserver/sicar/wfs',
            typeName:'sicar:sicar_imoveis_es',
            fields:[
              {name:'cod_imovel',label:'Código SICAR',type:'text',mode:'exact'},
              {name:'municipio',label:'Município',type:'text',mode:'contains'},
              {name:'status_imovel',label:'Status',type:'text',mode:'contains'},
              {name:'area',label:'Área (ha)',type:'number',mode:'exact'}
            ]
          },
          municipios:{
            label:'Limite municipal',
            url:'https://ide.geobases.es.gov.br/geoserver/ows',
            typeName:'geonode:idaf_limite_municipal_2018_11',
            fields:[
              {name:'nome',label:'Nome',type:'text',mode:'contains'}
            ]
          }
        };

        function setActiveButton(name){
          Object.values(buttons).forEach(function(button){
            button.classList.remove('active');
          });
          buttons[name].classList.add('active');
        }

        function removeDrawInteraction(){
          if(drawInteraction){
            map.removeInteraction(drawInteraction);
            drawInteraction=null;
          }
        }

        function formatLength(line){
          const length=ol.sphere.getLength(line);
          return length>=1000
            ? (length/1000).toFixed(2)+' km'
            : length.toFixed(2)+' m';
        }

        function formatArea(polygon){
          const area=ol.sphere.getArea(polygon);
          return area>=10000
            ? (area/10000).toFixed(4)+' ha'
            : area.toFixed(2)+' m²';
        }

        function createMeasureOverlay(){
          const element=document.createElement('div');
          element.className='measure-tooltip';

          measureOverlay=new ol.Overlay({
            element:element,
            offset:[0,-12],
            positioning:'bottom-center',
            stopEvent:false
          });

          map.addOverlay(measureOverlay);
          return element;
        }

        function activateNavigate(){
          removeDrawInteraction();
          setActiveButton('navigate');
        }

        function activateDraw(type,buttonName){
          removeDrawInteraction();
          setActiveButton(buttonName);

          drawInteraction=new ol.interaction.Draw({
            source:drawSource,
            type:type
          });

          map.addInteraction(drawInteraction);

          drawInteraction.on('drawstart',function(event){
            const feature=event.feature;
            const tooltipElement=createMeasureOverlay();

            feature.getGeometry().on('change',function(geometryEvent){
              const geometry=geometryEvent.target;
              let value='';

              if(geometry.getType()==='Polygon'){
                value=formatArea(geometry);
                if(measureOverlay){
                  measureOverlay.setPosition(
                    geometry.getInteriorPoint().getCoordinates()
                  );
                }
              }else if(geometry.getType()==='LineString'){
                value=formatLength(geometry);
                if(measureOverlay){
                  measureOverlay.setPosition(geometry.getLastCoordinate());
                }
              }

              if(value){
                tooltipElement.textContent=value;
              }
            });
          });

          drawInteraction.on('drawend',function(){
            measureOverlay=null;
          });
        }

        function closeInfo(){
          infoPanel.style.display='none';
        }

        function renderInfo(title,properties){
          let html=
            '<button class="close" type="button" aria-label="Fechar">×</button>'+ 
            '<h3>'+escapeHtml(title)+'</h3>'+ 
            '<table>';

          Object.entries(properties).forEach(function(entry){
            const key=entry[0];
            const value=entry[1];

            if(key==='geometry' || value===undefined || value===null){
              return;
            }

            html+=
              '<tr><td>'+escapeHtml(key)+'</td><td>'+ 
              escapeHtml(value)+'</td></tr>';
          });

          html+='</table>';
          infoPanel.innerHTML=html;
          infoPanel.style.display='block';
          infoPanel.querySelector('.close').addEventListener('click',closeInfo);
        }

        function showCoordinateInfo(lon4674,lat4674,east,north){
          renderInfo('Coordenada localizada',{
            'Latitude':lat4674.toFixed(8),
            'Longitude':lon4674.toFixed(8),
            'UTM Este':east.toFixed(3)+' m',
            'UTM Norte':north.toFixed(3)+' m',
            'SRC geográfico':'SIRGAS 2000 · EPSG:4674',
            'SRC UTM':'SIRGAS 2000 / UTM 24S · EPSG:31984'
          });
        }

        function showFeatureInfo(feature,title){
          const props=feature.getProperties();
          const clean={};

          Object.keys(props).forEach(function(key){
            if(key!=='geometry'){
              clean[key]=props[key];
            }
          });

          renderInfo(title,clean);
        }

        function locateCoordinate(){
          coordSearchStatus.textContent='';

          if(typeof proj4==='undefined'){
            coordSearchStatus.textContent='Proj4 indisponível';
            return;
          }

          let lon4674;
          let lat4674;
          let east;
          let north;

          if(coordMode.value==='decimal'){
            lat4674=parseNumber(latInput.value);
            lon4674=parseNumber(lonInput.value);

            if(
              !Number.isFinite(lat4674) ||
              !Number.isFinite(lon4674) ||
              lat4674<-90 || lat4674>90 ||
              lon4674<-180 || lon4674>180
            ){
              coordSearchStatus.textContent='Inválida';
              return;
            }

            const utm=proj4(
              'EPSG:4674',
              'EPSG:31984',
              [lon4674,lat4674]
            );

            east=utm[0];
            north=utm[1];
          }else{
            east=parseNumber(eastInput.value);
            north=parseNumber(northInput.value);

            if(
              !Number.isFinite(east) ||
              !Number.isFinite(north) ||
              east<100000 || east>900000 ||
              north<0 || north>10000000
            ){
              coordSearchStatus.textContent='UTM inválida';
              return;
            }

            const geographic=proj4(
              'EPSG:31984',
              'EPSG:4674',
              [east,north]
            );

            lon4674=geographic[0];
            lat4674=geographic[1];
          }

          const mapCoordinate=ol.proj.fromLonLat([lon4674,lat4674]);

          searchSource.clear();

          const marker=new ol.Feature({
            geometry:new ol.geom.Point(mapCoordinate),
            searchType:'coordinate'
          });

          searchSource.addFeature(marker);

          map.getView().animate({
            center:mapCoordinate,
            zoom:17,
            duration:450
          });

          coordSearchStatus.textContent='Localizado';
          showCoordinateInfo(lon4674,lat4674,east,north);
        }

        function updateQueryFields(){
          const definition=searchDefinitions[queryLayer.value];
          queryField.innerHTML='';

          definition.fields.forEach(function(field){
            const option=document.createElement('option');
            option.value=field.name;
            option.textContent=field.label;
            queryField.appendChild(option);
          });

          queryValue.value='';
          queryStatus.textContent='';
        }

        function buildCql(fieldDefinition,value){
          if(fieldDefinition.type==='number'){
            const numeric=parseNumber(value);

            if(!Number.isFinite(numeric)){
              throw new Error('Valor numérico inválido.');
            }

            return fieldDefinition.name+'='+numeric;
          }

          const safe=cqlQuote(value);

          if(fieldDefinition.mode==='exact'){
            return fieldDefinition.name+"='"+safe+"'";
          }

          return fieldDefinition.name+" ILIKE '%"+safe+"%'";
        }

        async function searchByAttribute(){
          const layerDefinition=searchDefinitions[queryLayer.value];
          const fieldDefinition=layerDefinition.fields.find(function(field){
            return field.name===queryField.value;
          });
          const value=String(queryValue.value||'').trim();

          queryStatus.textContent='';

          if(!value){
            queryStatus.textContent='Informe o valor';
            return;
          }

          let cql;

          try{
            cql=buildCql(fieldDefinition,value);
          }catch(error){
            queryStatus.textContent=error.message;
            return;
          }

          queryStatus.textContent='Consultando...';
          document.getElementById('btnFindAttribute').disabled=true;

          try{
            const params=new URLSearchParams({
              service:'WFS',
              version:'2.0.0',
              request:'GetFeature',
              typeNames:layerDefinition.typeName,
              outputFormat:'application/json',
              srsName:'EPSG:3857',
              count:'50',
              CQL_FILTER:cql
            });

            const response=await fetch(
              layerDefinition.url+'?'+params.toString()
            );

            if(!response.ok){
              throw new Error('HTTP '+response.status);
            }

            const json=await response.json();

            const features=new ol.format.GeoJSON().readFeatures(
              json,
              {
                dataProjection:'EPSG:3857',
                featureProjection:'EPSG:3857'
              }
            );

            if(!features.length){
              queryStatus.textContent='Não encontrado';
              return;
            }

            searchSource.clear();

            features.forEach(function(feature){
              feature.set('searchType','attribute');
              searchSource.addFeature(feature);
            });

            const extent=searchSource.getExtent();

            if(extent && !ol.extent.isEmpty(extent)){
              map.getView().fit(extent,{
                padding:[70,70,90,70],
                maxZoom:17,
                duration:550
              });
            }

            queryStatus.textContent=
              features.length===1
                ? '1 resultado'
                : features.length+' resultados';

            showFeatureInfo(
              features[0],
              layerDefinition.label+
              (features.length>1
                ? ' · primeiro de '+features.length
                : '')
            );
          }catch(error){
            console.error(error);
            queryStatus.textContent='Falha na consulta';
          }finally{
            document.getElementById('btnFindAttribute').disabled=false;
          }
        }

        layersToggle.addEventListener('click',function(){
          const collapsed=layersPanel.classList.toggle('collapsed');
          layersToggle.setAttribute(
            'aria-expanded',
            collapsed ? 'false' : 'true'
          );
        });

        baseSelect.addEventListener('change',function(){
          const value=baseSelect.value;

          googleLayer.setVisible(value==='google');
          orthoLayer.setVisible(value==='ortho');
          osmLayer.setVisible(value==='osm');

          orthoExtra.classList.toggle('visible',value==='ortho');

          if(value==='google'){
            basePreview.innerHTML='Google Satellite<br><small>XYZ experimental</small>';
          }else if(value==='ortho'){
            basePreview.innerHTML='Ortofoto 2012/2015<br><small>GEOBASES</small>';
          }else{
            basePreview.innerHTML='OpenStreetMap<br><small>mapa colaborativo</small>';
          }
        });

        orthoOpacity.addEventListener('input',function(){
          orthoLayer.setOpacity(Number(orthoOpacity.value));
        });

        toggleMunicipios.addEventListener('change',function(){
          municipiosLayer.setVisible(toggleMunicipios.checked);
        });

        toggleSicar.addEventListener('change',function(){
          sicarLayer.setVisible(toggleSicar.checked);
        });

        toggleLabels.addEventListener('change',function(){
          sicarLayer.changed();
        });

        coordMode.addEventListener('change',function(){
          const isUtm=coordMode.value==='utm';
          decimalFields.hidden=isUtm;
          utmFields.hidden=!isUtm;
          coordSearchStatus.textContent='';
        });

        queryLayer.addEventListener('change',updateQueryFields);

        document.getElementById('btnFindCoord').addEventListener(
          'click',
          locateCoordinate
        );

        document.getElementById('btnFindAttribute').addEventListener(
          'click',
          searchByAttribute
        );

        [latInput,lonInput,eastInput,northInput].forEach(function(input){
          input.addEventListener('keydown',function(event){
            if(event.key==='Enter'){
              locateCoordinate();
            }
          });
        });

        queryValue.addEventListener('keydown',function(event){
          if(event.key==='Enter'){
            searchByAttribute();
          }
        });

        buttons.navigate.addEventListener('click',activateNavigate);
        buttons.point.addEventListener('click',function(){
          activateDraw('Point','point');
        });
        buttons.line.addEventListener('click',function(){
          activateDraw('LineString','line');
        });
        buttons.polygon.addEventListener('click',function(){
          activateDraw('Polygon','polygon');
        });

        document.getElementById('btnClear').addEventListener('click',function(){
          drawSource.clear();
          searchSource.clear();

          map.getOverlays().getArray().slice().forEach(function(overlay){
            map.removeOverlay(overlay);
          });

          coordSearchStatus.textContent='';
          queryStatus.textContent='';
          closeInfo();
        });

        orthoSource.on('tileloaderror',function(){
          serviceStatus.textContent='Falha em algum tile da ortofoto.';
        });

        municipiosSource.on('tileloaderror',function(){
          serviceStatus.textContent='Falha em algum tile do limite municipal.';
        });

        googleSource.on('tileloaderror',function(){
          serviceStatus.textContent='Falha em algum tile do Google Satellite.';
        });

        sicarSource.on('featuresloadstart',function(){
          serviceStatus.textContent='Carregando SICAR...';
        });

        sicarSource.on('featuresloadend',function(event){
          (event.features||[]).forEach(function(feature){
            const area=Number(feature.get('area'));

            if(Number.isFinite(area)){
              feature.set('area_m2_calculada',area*10000,true);
            }
          });

          serviceStatus.textContent=
            'SICAR: '+sicarSource.getFeatures().length+' feições carregadas.';
        });

        sicarSource.on('featuresloaderror',function(){
          serviceStatus.textContent='Falha no WFS do SICAR.';
        });

        map.getView().on('change:resolution',function(){
          sicarLayer.changed();
        });

        map.on('singleclick',function(event){
          const feature=map.forEachFeatureAtPixel(
            event.pixel,
            function(candidate,layer){
              return layer===sicarLayer ? candidate : null;
            }
          );

          if(feature){
            showFeatureInfo(feature,'Imóvel SICAR');
          }
        });

        map.on('pointermove',function(event){
          const lonLat=ol.proj.toLonLat(event.coordinate);
          mapStatus.textContent=
            'Lat '+lonLat[1].toFixed(6)+
            ' · Lon '+lonLat[0].toFixed(6);
        });

        window.addEventListener('resize',function(){
          map.updateSize();
        });

        updateQueryFields();
      }catch(error){
        console.error(error);
        showError('Erro ao iniciar o mapa: '+error.message);
      }
    })();
  </script>
</body>
</html>
