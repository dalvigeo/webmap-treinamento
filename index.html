<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMap de Treinamento</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>

  <style>
    :root{
      --green:#236b3a;
      --bg:#f4f7f4;
      --panel:#fff;
      --line:#d8e1da;
      --text:#18211a;
      --muted:#617066;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
    header h1{margin:0;font-size:22px}
    header p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
    button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:8px 13px;font-weight:700;cursor:pointer}
    button.active{background:var(--green);border-color:var(--green);color:#fff}
    button.danger{color:#8a2929}
    #map{width:100%;height:calc(100vh - 167px);min-height:420px;background:#e8ece9}
    .status{display:flex;flex-wrap:wrap;gap:14px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    .status strong{color:var(--text)}
    .measure-tooltip{position:relative;background:rgba(20,38,25,.86);color:#fff;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:bold;white-space:nowrap;pointer-events:none}
    .error{display:none;padding:10px 14px;background:#fff2f2;border-bottom:1px solid #e3baba;color:#8a2929;font-size:13px}
    @media(max-width:640px){header{padding:12px}header h1{font-size:19px}#map{height:62vh;min-height:390px}.toolbar{display:grid;grid-template-columns:repeat(2,1fr)}button{width:100%}}
  </style>
</head>
<body>
  <header>
    <h1>WebMap de Treinamento</h1>
    <p>OpenLayers + OpenStreetMap · processamento local no navegador</p>
  </header>

  <div id="error" class="error"></div>

  <div class="toolbar">
    <button id="btnNavigate" class="active" type="button">Navegar</button>
    <button id="btnPoint" type="button">Ponto</button>
    <button id="btnLine" type="button">Linha</button>
    <button id="btnPolygon" type="button">Polígono</button>
    <button id="btnClear" class="danger" type="button">Limpar desenhos</button>
  </div>

  <div id="map"></div>

  <div class="status">
    <span>Ferramenta: <strong id="modeText">Navegar</strong></span>
    <span>Coordenadas: <strong id="coordText">—</strong></span>
    <span>Última medição: <strong id="measureText">—</strong></span>
  </div>

  <script>
    (function(){
      const errorBox=document.getElementById('error');
      function showError(message){
        errorBox.style.display='block';
        errorBox.textContent=message;
      }

      if(typeof ol==='undefined'){
        showError('Erro ao carregar o OpenLayers. Verifique sua conexão com a internet ou o acesso ao CDN.');
        return;
      }

      try{
        const vectorSource=new ol.source.Vector();
        const vectorLayer=new ol.layer.Vector({
          source:vectorSource,
          style:new ol.style.Style({
            fill:new ol.style.Fill({color:'rgba(35,107,58,0.20)'}),
            stroke:new ol.style.Stroke({color:'#236b3a',width:3}),
            image:new ol.style.Circle({
              radius:6,
              fill:new ol.style.Fill({color:'#236b3a'}),
              stroke:new ol.style.Stroke({color:'#fff',width:2})
            })
          })
        });

        const map=new ol.Map({
          target:'map',
          layers:[
            new ol.layer.Tile({source:new ol.source.OSM()}),
            vectorLayer
          ],
          view:new ol.View({
            center:ol.proj.fromLonLat([-40.5,-19.6]),
            zoom:8
          })
        });

        let drawInteraction=null;
        let measureOverlay=null;

        const modeText=document.getElementById('modeText');
        const coordText=document.getElementById('coordText');
        const measureText=document.getElementById('measureText');
        const buttons={
          navigate:document.getElementById('btnNavigate'),
          point:document.getElementById('btnPoint'),
          line:document.getElementById('btnLine'),
          polygon:document.getElementById('btnPolygon')
        };

        function setActiveButton(name){
          Object.values(buttons).forEach(b=>b.classList.remove('active'));
          buttons[name].classList.add('active');
        }

        function removeDrawInteraction(){
          if(drawInteraction){
            map.removeInteraction(drawInteraction);
            drawInteraction=null;
          }
        }

        function formatLength(line){
          const length=ol.sphere.getLength(line);
          return length>=1000 ? (length/1000).toFixed(2)+' km' : length.toFixed(2)+' m';
        }

        function formatArea(polygon){
          const area=ol.sphere.getArea(polygon);
          return area>=10000 ? (area/10000).toFixed(4)+' ha' : area.toFixed(2)+' m²';
        }

        function createMeasureOverlay(){
          const element=document.createElement('div');
          element.className='measure-tooltip';
          measureOverlay=new ol.Overlay({
            element:element,
            offset:[0,-12],
            positioning:'bottom-center',
            stopEvent:false
          });
          map.addOverlay(measureOverlay);
          return element;
        }

        function activateNavigate(){
          removeDrawInteraction();
          setActiveButton('navigate');
          modeText.textContent='Navegar';
        }

        function activateDraw(type,buttonName,label){
          removeDrawInteraction();
          setActiveButton(buttonName);
          modeText.textContent=label;

          drawInteraction=new ol.interaction.Draw({source:vectorSource,type:type});
          map.addInteraction(drawInteraction);

          drawInteraction.on('drawstart',function(event){
            measureText.textContent='Desenhando...';
            const feature=event.feature;
            const tooltipElement=createMeasureOverlay();

            feature.getGeometry().on('change',function(geometryEvent){
              const geometry=geometryEvent.target;
              let value='';

              if(geometry.getType()==='Polygon'){
                value=formatArea(geometry);
                if(measureOverlay) measureOverlay.setPosition(geometry.getInteriorPoint().getCoordinates());
              }else if(geometry.getType()==='LineString'){
                value=formatLength(geometry);
                if(measureOverlay) measureOverlay.setPosition(geometry.getLastCoordinate());
              }

              if(value){
                tooltipElement.textContent=value;
                measureText.textContent=value;
              }
            });
          });

          drawInteraction.on('drawend',function(event){
            const geometry=event.feature.getGeometry();
            if(geometry.getType()==='Point'){
              const lonLat=ol.proj.toLonLat(geometry.getCoordinates());
              measureText.textContent='Lat '+lonLat[1].toFixed(6)+' · Lon '+lonLat[0].toFixed(6);
            }
            measureOverlay=null;
          });
        }

        buttons.navigate.addEventListener('click',activateNavigate);
        buttons.point.addEventListener('click',()=>activateDraw('Point','point','Desenhar ponto'));
        buttons.line.addEventListener('click',()=>activateDraw('LineString','line','Desenhar linha'));
        buttons.polygon.addEventListener('click',()=>activateDraw('Polygon','polygon','Desenhar polígono'));

        document.getElementById('btnClear').addEventListener('click',function(){
          vectorSource.clear();
          map.getOverlays().getArray().slice().forEach(o=>map.removeOverlay(o));
          measureText.textContent='—';
        });

        map.on('pointermove',function(event){
          const lonLat=ol.proj.toLonLat(event.coordinate);
          coordText.textContent='Lat '+lonLat[1].toFixed(6)+' · Lon '+lonLat[0].toFixed(6);
        });

        window.addEventListener('resize',()=>map.updateSize());
      }catch(err){
        console.error(err);
        showError('Erro ao iniciar o mapa: '+err.message);
      }
    })();
  </script>
</body>
</html>
