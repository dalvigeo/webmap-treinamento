<body>
<header><div class="brand"><h1>EncontraCAR</h1><p>Localização e consulta geoespacial de imóveis rurais</p></div><div class="draw-tools"><button id="btnNavigate" class="active" type="button">Navegar</button><button id="btnPoint" type="button">Ponto</button><button id="btnLine" type="button">Linha</button><button id="btnPolygon" type="button">Polígono</button><button id="btnClear" class="danger" type="button">Limpar</button></div></header>

<label class="layer-row"><input id="toggleSicar" type="checkbox" checked><span class="swatch" style="background:rgba(251,154,153,.45);border:1px solid #ff7f00"></span>Imóveis SICAR</label>
<label class="layer-row layer-sub"><input id="toggleLabels" type="checkbox" checked>Rótulos SICAR</label>
<label class="layer-row"><input id="toggleSimlam" type="checkbox" checked><span class="swatch" style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid rgba(85,255,0,.8);border-radius:0"></span>Empreendimentos SIMLAM</label>
<div id="serviceStatus" class="service-status">Serviços prontos.</div></div></section>
<section class="floating base"><strong>Mapa base</strong><select id="baseSelect"><option value="google" selected>Google Satellite</option><option value="ortho2020">Ortofoto 2019/2020</option><option value="ortho2015">Ortofoto 2012/2015</option><option value="ortho2008">Ortofoto 2007/2008</option><option value="osm">OpenStreetMap</option></select><div id="basePreview" class="base-preview">Google Satellite<br><small>XYZ experimental</small></div><div id="orthoExtra" class="base-extra"><span>Opac.</span><input id="orthoOpacity" type="range" min="0" max="1" step="0.05" value="1"></div></section>
<section class="bottom"><div class="search-group"><strong>Coordenadas</strong><select id="coordMode"><option value="decimal">Grau decimal</option><option value="utm">UTM 24S</option></select><span id="decimalFields"><input id="latInput" class="coord" placeholder="Lat. -19,50"><input id="lonInput" class="coord" placeholder="Long. -40,50"></span><span id="utmFields" hidden><input id="eastInput" class="coord" placeholder="E 350000"><input id="northInput" class="coord" placeholder="N 7840000"></span><button id="btnFindCoord" type="button">Ir</button><span id="coordSearchStatus" class="dock-status"></span></div><div class="search-group"><strong>Buscar atributo</strong><select id="queryLayer"><option value="sicar">Imóveis SICAR</option><option value="simlam">Empreendimentos SIMLAM</option><option value="municipios">Limite municipal</option></select><select id="queryField"></select><input id="queryValue" placeholder="Valor"><button id="btnFindAttribute" type="button">Buscar</button><span id="queryStatus" class="dock-status"></span></div></section>
<div id="mapStatus" class="map-status">Lat — · Lon —</div><aside id="infoPanel" class="info"></aside></main>

function featureSummary(item){const f=item.feature;if(item.kind==='simlam')return{main:String(f.get('COD_EMPREENDIMENTO')??''),sub:'Empreendimento SIMLAM'};if(item.kind==='sicar'){const cod=String(f.get('cod_imovel')||''),area=Number(f.get('area')),mun=String(f.get('municipio')||''),parts=[];if(Number.isFinite(area))parts.push(area.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ha');if(mun)parts.push(mun);return{main:'SICAR '+(cod?'…'+cod.slice(-8):'sem código'),sub:parts.join(' · ')}}return{main:String(f.get('nome')||f.get('municipio')||'Município'),sub:'Limite municipal'}}
function renderFeatureList(title,items){if(!items.length){closeInfo();return}let h='<button class="close" type="button" aria-label="Fechar">×</button><h3>'+esc(title)+'</h3><div class="info-count">'+items.length+' feição'+(items.length===1?'':'ões')+'</div><div class="feature-list compact">';items.forEach((item,i)=>{const s=featureSummary(item),extra=i>=3?' feature-extra':'';h+='<details class="feature-item'+extra+'" data-index="'+i+'"'+(i===0?' open':'')+'><summary><span class="feature-title"><strong>'+esc(s.main)+'</strong><small>'+esc(s.sub||item.label)+'</small></span><span class="feature-arrow">▼</span></summary><div class="feature-details">'+propsTable(item)+'</div></details>'});h+='</div>';if(items.length>3)h+='<button class="info-more" type="button">Mostrar mais ('+(items.length-3)+')</button>';infoPanel.innerHTML=h;infoPanel.style.display='block';infoPanel.querySelector('.close').onclick=closeInfo;const details=[...infoPanel.querySelectorAll('.feature-item')];details.forEach(d=>d.addEventListener('toggle',()=>{if(!d.open)return;details.forEach(o=>{if(o!==d)o.open=false});highlight(items[Number(d.dataset.index)].feature)}));const more=infoPanel.querySelector('.info-more');if(more)more.onclick=()=>{const list=infoPanel.querySelector('.feature-list'),compact=list.classList.toggle('compact');more.textContent=compact?'Mostrar mais ('+(items.length-3)+')':'Mostrar menos'};highlight(items[0].feature)}
function locateCoord(){coordSearchStatus.textContent='';if(typeof proj4==='undefined'){coordSearchStatus.textContent='Proj4 indisponível';return}let lon,lat,e,n;if(coordMode.value==='decimal'){lat=num(latInput.value);lon=num(lonInput.value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){coordSearchStatus.textContent='Inválida';return}[e,n]=proj4('EPSG:4674','EPSG:31984',[lon,lat])}else{e=num(eastInput.value);n=num(northInput.value);if(!Number.isFinite(e)||!Number.isFinite(n)){coordSearchStatus.textContent='UTM inválida';return}[lon,lat]=proj4('EPSG:31984','EPSG:4674',[e,n])}clearSelection(true);const mc=ol.proj.fromLonLat([lon,lat]),f=new ol.Feature({geometry:new ol.geom.Point(mc),searchType:'coordinate'});searchSource.addFeature(f);map.getView().animate({center:mc,zoom:17,duration:450});coordSearchStatus.textContent='Localizado';infoPanel.innerHTML='<button class="close" type="button">×</button><h3>Coordenada localizada</h3><div class="feature-details"><table><tr><td>Latitude</td><td>'+lat.toFixed(8)+'</td></tr><tr><td>Longitude</td><td>'+lon.toFixed(8)+'</td></tr><tr><td>UTM Este</td><td>'+e.toFixed(3)+' m</td></tr><tr><td>UTM Norte</td><td>'+n.toFixed(3)+' m</td></tr></table></div>';infoPanel.style.display='block';infoPanel.querySelector('.close').onclick=closeInfo}
function updateFields(){const d=defs[queryLayer.value];queryField.innerHTML='';d.fields.forEach(f=>{const o=document.createElement('option');o.value=f.name;o.textContent=f.label;queryField.appendChild(o)});queryValue.value='';queryStatus.textContent=''}function buildCql(f,v){if(f.type==='number'){const x=num(v);if(!Number.isFinite(x))throw Error('Valor inválido');return f.name+'='+x}const s=quote(v);return f.mode==='exact'?f.name+"='"+s+"'":f.name+" ILIKE '%"+s+"%'"}
async function searchAttr(){const d=defs[queryLayer.value],f=d.fields.find(x=>x.name===queryField.value),v=String(queryValue.value||'').trim();if(!v){queryStatus.textContent='Informe o valor';return}if(d.mode==='simlam'){const cod=num(v);if(!Number.isInteger(cod)){queryStatus.textContent='Código inválido';return}queryStatus.textContent=simlamIndex?'Consultando...':'Preparando índice de busca...';$('btnFindAttribute').disabled=true;try{const fs=await buscarSimlamPorCodigo(cod);if(!fs.length){clearSelection(true);queryStatus.textContent='Não encontrado';return}clearSelection(true);fs.forEach(x=>{const c=x.clone();c.set('searchType','attribute');c.set('sourceLayer','simlam');searchSource.addFeature(c)});map.getView().fit(searchSource.getExtent(),{padding:[70,70,90,70],maxZoom:17,duration:550});queryStatus.textContent=fs.length+' resultado'+(fs.length>1?'s':'');renderFeatureList('Resultados da busca',fs.map(x=>({feature:x,kind:'simlam',label:d.label})))}catch(e){console.error(e);queryStatus.textContent='Falha ao consultar a base SIMLAM'}finally{$('btnFindAttribute').disabled=false}return}let filter;try{filter=buildCql(f,v)}catch(e){queryStatus.textContent=e.message;return}queryStatus.textContent='Consultando...';$('btnFindAttribute').disabled=true;try{const p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:d.typeName,outputFormat:'application/json',srsName:'EPSG:3857',count:'50',CQL_FILTER:filter}),r=await fetch(d.url+'?'+p);if(!r.ok)throw Error('HTTP '+r.status);const fs=new ol.format.GeoJSON().readFeatures(await r.json(),{dataProjection:'EPSG:3857',featureProjection:'EPSG:3857'});if(!fs.length){clearSelection(true);queryStatus.textContent='Não encontrado';return}clearSelection(true);fs.forEach(x=>{const c=x.clone();c.set('searchType','attribute');c.set('sourceLayer',queryLayer.value);searchSource.addFeature(c)});map.getView().fit(searchSource.getExtent(),{padding:[70,70,90,70],maxZoom:17,duration:550});queryStatus.textContent=fs.lengt function sortSicar(fs){return fs.slice().sort((a,b)=>{const aa=Number(a.get('area')),bb=Number(b.get('area'));if(Number.isFinite(aa)&&Number.isFinite(bb))return aa-bb;return ol.extent.getArea(a.getGeometry().getExtent())-ol.extent.getArea(b.getGeometry().getExtent())})}function uniqueSicar(fs){const seen=new Set();return sortSicar(fs).filter((f,i)=>{const key=String(f.get('cod_imovel')||f.getId()||i);if(seen.has(key))return false;seen.add(key);return true})}function uniqueSimlam(fs){const seen=new Set();return fs.filter((f,i)=>{const c=f.get('COD_EMPREENDIMENTO');const g=f.getGeometry(),key=String(c)+'|'+(g?g.getCoordinates().join(','):i);if(seen.has(key))return false;seen.add(key);return c!==null&&c!==undefined})}
async function municipioAt(coord){if(!$('toggleMunicipios').checked)return null;const res=map.getView().getResolution()||1,t=Math.max(res*7,1),bbox=[coord[0]-t,coord[1]-t,coord[0]+t,coord[1]+t],p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'geonode:idaf_limite_municipal_2018_11',outputFormat:'application/json',srsName:'EPSG:3857',count:'5',bbox:bbox.join(',')+',EPSG:3857'});try{const r=await fetch(geobases+'?'+p);if(!r.ok)return null;const fs=new ol.format.GeoJSON().readFeatures(await r.json(),{dataProjection:'EPSG:3857',featureProjection:'EPSG:3857'});return fs.find(x=>x.getGeometry().intersectsCoordinate(coord))||fs[0]||null}catch(e){console.error(e);return null}}
