<style>
:root{--green:#236b3a;--panel:#fff;--line:#d5ddd7;--text:#18211a;--muted:#617066;--shadow:0 3px 14px rgba(0,0,0,.18)}

@media(max-width:850px){.brand p{display:none}.layers{width:190px}.info{width:min(320px,calc(100% - 215px))}.bottom{left:10px}.base{bottom:70px;width:132px;height:132px}.map-status{bottom:68px}}

</style>
</head>
<body>
<header><div class="brand"><h1>WebMap de Treinamento</h1><p>OpenLayers · WMS · WFS · XYZ · processamento local</p></div><div class="draw-tools"><button id="btnNavigate" class="active">Navegar</button><button id="btnPoint">Ponto</button><button id="btnLine">Linha</button><button id="btnPolygon">Polígono</button><button id="btnClear" class="danger">Limpar</button></div></header>
<main class="map-shell"><div id="error" class="error"></div><div id="map"></div>
<section id="layersPanel" class="floating layers"><button id="layersToggle" class="panel-title"><strong>Camadas vetoriais</strong><span class="arrow">▼</span></button><div class="layer-content"><label class="layer-row"><input id="toggleMunicipios" type="checkbox" checked>Limite municipal</label><label class="layer-row"><input id="toggleSicar" type="checkbox" checked>Imóveis SICAR</label><label class="layer-row layer-sub"><input id="toggleLabels" type="checkbox" checked>Rótulos SICAR</label><div id="serviceStatus" class="service-status">Serviços prontos.</div></div></section>
<section class="floating base"><strong>Mapa base</strong><select id="baseSelect"><option value="google" selected>Google Satellite</option><option value="ortho">Ortofoto 2012/2015</option><option value="osm">OpenStreetMap</option></select><div id="basePreview" class="base-preview">Google Satellite<br><small>XYZ experimental</small></div><div id="orthoExtra" class="base-extra"><span>Opac.</span><input id="orthoOpacity" type="range" min="0" max="1" step="0.05" value="1"></div></section>
<section class="bottom"><div class="search-group"><strong>Coordenadas</strong><select id="coordMode"><option value="decimal">Grau decimal</option><option value="utm">UTM 24S</option></select><span id="decimalFields"><input id="latInput" class="coord" placeholder="Lat. -19,50"><input id="lonInput" class="coord" placeholder="Long. -40,50"></span><span id="utmFields" hidden><input id="eastInput" class="coord" placeholder="E 350000"><input id="northInput" class="coord" placeholder="N 7840000"></span><button id="btnFindCoord">Ir</button><span id="coordSearchStatus" class="dock-status"></span></div><div class="search-group"><strong>Buscar atributo</strong><select id="queryLayer"><option value="sicar">Imóveis SICAR</option><option value="municipios">Limite municipal</option></select><select id="queryField"></select><input id="queryValue" placeholder="Valor"><button id="btnFindAttribute">Buscar</button><span id="queryStatus" class="dock-status"></span></div></section>
<div id="mapStatus" class="map-status">Lat — · Lon —</div><aside id="infoPanel" class="info"></aside></main>
<script>
(function(){
const $=id=>document.getElementById(id),errorBox=$('error'),serviceStatus=$('serviceStatus'),infoPanel=$('infoPanel'),toggleMunicipios=$('toggleMunicipios'),toggleSicar=$('toggleSicar'),toggleLabels=$('toggleLabels'),layersPanel=$('layersPanel'),baseSelect=$('baseSelect'),basePreview=$('basePreview'),orthoExtra=$('orthoExtra'),orthoOpacity=$('orthoOpacity'),coordMode=$('coordMode'),decimalFields=$('decimalFields'),utmFields=$('utmFields'),coordSearchStatus=$('coordSearchStatus'),latInput=$('latInput'),lonInput=$('lonInput'),eastInput=$('eastInput'),northInput=$('northInput'),queryLayer=$('queryLayer'),queryField=$('queryField'),queryValue=$('queryValue'),queryStatus=$('queryStatus'),mapStatus=$('mapStatus');
function showError(m){errorBox.style.display='block';errorBox.textContent=m;setTimeout(()=>errorBox.style.display='none',5000)}function num(v){return Number(String(v).trim().replace(',','.'))}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function cql(v){return String(v).replaceAll("'","''")}
if(typeof ol==='undefined'){showError('Erro ao carregar o OpenLayers.');return}if(typeof proj4!=='undefined'){proj4.defs('EPSG:4674','+proj=longlat +ellps=GRS80 +no_defs +type=crs');proj4.defs('EPSG:31984','+proj=utm +zone=24 +south +ellps=GRS80 +units=m +no_defs +type=crs')}
try{
const osmLayer=new ol.layer.Tile({source:new ol.source.OSM(),visible:false,zIndex:0});

const sicarSource=new ol.source.Vector({format:new ol.format.GeoJSON(),url:extent=>{const p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'sicar:sicar_imoveis_es',outputFormat:'application/json',srsName:'EPSG:3857',count:'10000',bbox:extent.join(',')+',EPSG:3857'});return'https://geoserver.car.gov.br/geoserver/sicar/wfs?'+p},strategy:ol.loadingstrategy.bbox});let map;
function sicarStyle(f){const cod=String(f.get('cod_imovel')||''),area=Number(f.get('area'));let t='';if(toggleLabels.checked&&map&&map.getView().getZoom()>=14){t='Sicar: ...'+(cod?cod.slice(-5):'-----');if(Number.isFinite(area))t+='\n'+area.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ha'}return new ol.style.Style({fill:new ol.style.Fill({color:'rgba(251,154,153,.30)'}),stroke:new ol.style.Stroke({color:'rgba(255,127,0,.95)',width:1}),text:t?new ol.style.Text({text:t,font:'10px Arial',fill:new ol.style.Fill({color:'#000'}),stroke:new ol.style.Stroke({color:'#fff',width:3})}):undefined})}
const sicarLayer=new ol.layer.Vector({source:sicarSource,style:sicarStyle,minZoom:12,zIndex:10,renderOrder:(a,b)=>Number(b.get('area')||0)-Number(a.get('area')||0)});
const highlightStyle=new ol.style.Style({fill:new ol.style.Fill({color:'rgba(255,235,59,.16)'}),stroke:new ol.style.Stroke({color:'#e00000',width:4}),image:new ol.style.Circle({radius:9,fill:new ol.style.Fill({color:'rgba(255,255,255,.95)'}),stroke:new ol.style.Stroke({color:'#e00000',width:4})})});
const searchSource=new ol.source.Vector(),searchLayer=new ol.layer.Vector({source:searchSource,zIndex:18,style:f=>f.get('searchType')==='coordinate'?new ol.style.Style({image:new ol.style.Circle({radius:9,fill:new ol.style.Fill({color:'#fff'}),stroke:new ol.style.Stroke({color:'#d52020',width:4})})}):highlightStyle});
const identifySource=new ol.source.Vector(),identifyLayer=new ol.layer.Vector({source:identifySource,zIndex:19,style:highlightStyle});
const drawSource=new ol.source.Vector(),drawLayer=new ol.layer.Vector({source:drawSource,zIndex:20,style:new ol.style.Style({fill:new ol.style.Fill({color:'rgba(35,107,58,.20)'}),stroke:new ol.style.Stroke({color:'#236b3a',width:3}),image:new ol.style.Circle({radius:6,fill:new ol.style.Fill({color:'#236b3a'}),stroke:new ol.style.Stroke({color:'#fff',width:2})})})});
map=new ol.Map({target:'map',layers:[osmLayer,orthoLayer,googleLayer,municipiosLayer,sicarLayer,searchLayer,identifyLayer,drawLayer],view:new ol.View({center:ol.proj.fromLonLat([-40.5,-19.6]),zoom:8})});let drawInteraction=null,measureOverlay=null;
const buttons={navigate:$('btnNavigate'),point:$('btnPoint'),line:$('btnLine'),polygon:$('btnPolygon')};
const defs={sicar:{label:'Imóveis SICAR',url:'https://geoserver.car.gov.br/geoserver/sicar/wfs',typeName:'sicar:sicar_imoveis_es',fields:[{name:'cod_imovel',label:'Código SICAR',type:'text',mode:'exact'},{name:'municipio',label:'Município',type:'text',mode:'contains'},{name:'status_imovel',label:'Status',type:'text',mode:'contains'},{name:'area',label:'Área (ha)',type:'number',mode:'exact'}]},municipios:{label:'Limite municipal',url:'https://ide.geobases.es.gov.br/geoserver/ows',typeName:'geonode:idaf_limite_municipal_2018_11',fields:[{name:'nome',label:'Nome',type:'text',mode:'contains'}]}};
function active(n){Object.values(buttons).forEach(b=>b.classList.remove('active'));buttons[n].classList.add('active')}function stopDraw(){if(drawInteraction){map.removeInteraction(drawInteraction);drawInteraction=null}}function fmtLen(g){const x=ol.sphere.getLength(g);return x>=1000?(x/1000).toFixed(2)+' km':x.toFixed(2)+' m'}function fmtArea(g){const x=ol.sphere.getArea(g);return x>=10000?(x/10000).toFixed(4)+' ha':x.toFixed(2)+' m²'}function tooltip(){const e=document.createElement('div');e.className='measure-tooltip';measureOverlay=new ol.Overlay({element:e,offset:[0,-12],positioning:'bottom-center',stopEvent:false});map.addOverlay(measureOverlay);return e}
function navigate(){stopDraw();active('navigate')}function draw(type,name){stopDraw();active(name);drawInteraction=new ol.interaction.Draw({source:drawSource,type});map.addInteraction(drawInteraction);drawInteraction.on('drawstart',ev=>{const el=tooltip();ev.feature.getGeometry().on('change',g=>{const x=g.target;if(x.getType()==='Polygon'){el.textContent=fmtArea(x);measureOverlay&&measureOverlay.setPosition(x.getInteriorPoint().getCoordinates())}else if(x.getType()==='LineString'){el.textContent=fmtLen(x);measureOverlay&&measureOverlay.setPosition(x.getLastCoordinate())}})});drawInteraction.on('drawend',()=>measureOverlay=null)}
function closeInfo(){infoPanel.style.display='none'}function renderInfo(title,props){let h='<button class="close" type="button">×</button><h3>'+esc(title)+'</h3><table>';Object.entries(props).forEach(([k,v])=>{if(k!=='geometry'&&v!==undefined&&v!==null)h+='<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>'});infoPanel.innerHTML=h+'</table>';infoPanel.style.display='block';infoPanel.querySelector('.close').onclick=closeInfo}function showFeature(f,title){const p=f.getProperties(),o={};Object.keys(p).forEach(k=>{if(k!=='geometry'&&k!=='searchType'&&k!=='sourceLayer'&&k!=='identifyHighlight')o[k]=p[k]});renderInfo(title,o)}function highlight(f){identifySource.clear();if(f&&f.getGeometry()){const c=f.clone();c.set('identifyHighlight',true,true);identifySource.addFeature(c)}}
function locateCoord(){coordSearchStatus.textContent='';if(typeof proj4==='undefined'){coordSearchStatus.textContent='Proj4 indisponível';return}let lon,lat,e,n;if(coordMode.value==='decimal'){lat=num(latInput.value);lon=num(lonInput.value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){coordSearchStatus.textContent='Inválida';return}[e,n]=proj4('EPSG:4674','EPSG:31984',[lon,lat])}else{e=num(eastInput.value);n=num(northInput.value);if(!Number.isFinite(e)||!Number.isFinite(n)){coordSearchStatus.textContent='UTM inválida';return}[lon,lat]=proj4('EPSG:31984','EPSG:4674',[e,n])}const mc=ol.proj.fromLonLat([lon,lat]);searchSource.clear();searchSource.addFeature(new ol.Feature({geometry:new ol.geom.Point(mc),searchType:'coordinate'}));map.getView().animate({center:mc,zoom:17,duration:450});coordSearchStatus.textContent='Localizado';renderInfo('Coordenada localizada',{Latitude:lat.toFixed(8),Longitude:lon.toFixed(8),'UTM Este':e.toFixed(3)+' m','UTM Norte':n.toFixed(3)+' m'})}
function updateFields(){const d=defs[queryLayer.value];queryField.innerHTML='';d.fields.forEach(f=>{const o=document.createElement('option');o.value=f.name;o.textContent=f.label;queryField.appendChild(o)});queryValue.value='';queryStatus.textContent=''}function buildCql(f,v){if(f.type==='number'){const x=num(v);if(!Number.isFinite(x))throw Error('Valor inválido');return f.name+'='+x}const s=cql(v);return f.mode==='exact'?f.name+"='"+s+"'":f.name+" ILIKE '%"+s+"%'"}
async function searchAttr(){const d=defs[queryLayer.value],f=d.fields.find(x=>x.name===queryField.value),v=String(queryValue.value||'').trim();if(!v){queryStatus.textContent='Informe o valor';return}let filter;try{filter=buildCql(f,v)}catch(e){queryStatus.textContent=e.message;return}queryStatus.textContent='Consultando...';$('btnFindAttribute').disabled=true;try{const p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:d.typeName,outputFormat:'application/json',srsName:'EPSG:3857',count:'50',CQL_FILTER:filter}),r=await fetch(d.url+'?'+p);if(!r.ok)throw Error('HTTP '+r.status);const fs=new ol.format.GeoJSON().readFeatures(await r.json(),{dataProjection:'EPSG:3857',featureProjection:'EPSG:3857'});if(!fs.length){queryStatus.textContent='Não encontrado';return}searchSource.clear();fs.forEach(x=>{x.set('searchType','attribute');x.set('sourceLayer',queryLayer.value,true);searchSource.addFeature(x)});map.getView().fit(searchSource.getExtent(),{padding:[70,70,90,70],maxZoom:17,duration:550});queryStatus.textContent=fs.length+' resultado'+(fs.length>1?'s':'');showFeature(fs[0],d.label)}catch(e){console.error(e);queryStatus.textContent='Falha na consulta'}finally{$('btnFindAttribute').disabled=false}}
function bestSicar(fs){return fs.slice().sort((a,b)=>{const aa=Number(a.get('area')),bb=Number(b.get('area'));if(Number.isFinite(aa)&&Number.isFinite(bb))return aa-bb;return ol.extent.getArea(a.getGeometry().getExtent())-ol.extent.getArea(b.getGeometry().getExtent())})[0]||null}
async function identifyMunicipio(coord){if(!toggleMunicipios.checked||!municipiosLayer.getVisible())return false;const res=map.getView().getResolution()||1,t=Math.max(res*7,1),bbox=[coord[0]-t,coord[1]-t,coord[0]+t,coord[1]+t],p=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'geonode:idaf_limite_municipal_2018_11',outputFormat:'application/json',srsName:'EPSG:3857',count:'5',bbox:bbox.join(',')+',EPSG:3857'});try{serviceStatus.textContent='Identificando município...';const r=await fetch('https://ide.geobases.es.gov.br/geoserver/ows?'+p);if(!r.ok)throw Error('HTTP '+r.status);const fs=new ol.format.GeoJSON().readFeatures(await r.json(),{dataProjection:'EPSG:3857',featureProjection:'EPSG:3857'});if(!fs.length)return false;const f=fs.find(x=>x.getGeometry()&&x.getGeometry().intersectsCoordinate(coord))||fs[0];highlight(f);showFeature(f,'Limite municipal');serviceStatus.textContent='Município identificado.';return true}catch(e){console.error(e);serviceStatus.textContent='Falha ao identificar município.';return false}}
$('layersToggle').onclick=()=>layersPanel.classList.toggle('collapsed');baseSelect.onchange=()=>{const v=baseSelect.value;googleLayer.setVisible(v==='google');orthoLayer.setVisible(v==='ortho');osmLayer.setVisible(v==='osm');orthoExtra.classList.toggle('visible',v==='ortho');basePreview.innerHTML=v==='google'?'Google Satellite<br><small>XYZ experimental</small>':v==='ortho'?'Ortofoto 2012/2015<br><small>GEOBASES</small>':'OpenStreetMap<br><small>mapa colaborativo</small>'};orthoOpacity.oninput=()=>orthoLayer.setOpacity(Number(orthoOpacity.value));toggleMunicipios.onchange=()=>municipiosLayer.setVisible(toggleMunicipios.checked);toggleSicar.onchange=()=>sicarLayer.setVisible(toggleSicar.checked);toggleLabels.onchange=()=>sicarLayer.changed();coordMode.onchange=()=>{const u=coordMode.value==='utm';decimalFields.hidden=u;utmFields.hidden=!u};queryLayer.onchange=updateFields;$('btnFindCoord').onclick=locateCoord;$('btnFindAttribute').onclick=searchAttr;[latInput,lonInput,eastInput,northInput].forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')locateCoord()});queryValue.onkeydown=e=>{if(e.key==='Enter')searchAttr()};buttons.navigate.onclick=navigate;buttons.point.onclick=()=>draw('Point','point');buttons.line.onclick=()=>draw('LineString','line');buttons.polygon.onclick=()=>draw('Polygon','polygon');
$('btnClear').onclick=()=>{drawSource.clear();searchSource.clear();identifySource.clear();map.getOverlays().getArray().slice().forEach(o=>map.removeOverlay(o));coordSearchStatus.textContent='';queryStatus.textContent='';closeInfo()};orthoSource.on('tileloaderror',()=>serviceStatus.textContent='Falha na ortofoto.');municipiosSource.on('tileloaderror',()=>serviceStatus.textContent='Falha no limite municipal.');googleSource.on('tileloaderror',()=>serviceStatus.textContent='Falha no Google Satellite.');sicarSource.on('featuresloadstart',()=>serviceStatus.textContent='Carregando SICAR...');sicarSource.on('featuresloadend',ev=>{(ev.features||[]).forEach(f=>{const a=Number(f.get('area'));if(Number.isFinite(a))f.set('area_m2_calculada',a*10000,true)});serviceStatus.textContent='SICAR: '+sicarSource.getFeatures().length+' feições carregadas.'});sicarSource.on('featuresloaderror',()=>serviceStatus.textContent='Falha no WFS do SICAR.');map.getView().on('change:resolution',()=>sicarLayer.changed());
map.on('singleclick',async ev=>{if(drawInteraction)return;const sic=[],searched=[];map.forEachFeatureAtPixel(ev.pixel,(f,l)=>{if(l===sicarLayer)sic.push(f);else if(l===searchLayer&&f.get('searchType')!=='coordinate')searched.push(f)},{hitTolerance:10,layerFilter:l=>l===sicarLayer||l===searchLayer});const sf=bestSicar(sic);if(sf){highlight(sf);showFeature(sf,'Imóvel SICAR');serviceStatus.textContent='Imóvel SICAR identificado.';return}if(searched.length){const f=searched[0];highlight(f);showFeature(f,f.get('sourceLayer')==='municipios'?'Limite municipal':'Imóvel SICAR');return}if(!await identifyMunicipio(ev.coordinate)){identifySource.clear()}});
map.on('pointermove',ev=>{const ll=ol.proj.toLonLat(ev.coordinate);mapStatus.textContent='Lat '+ll[1].toFixed(6)+' · Lon '+ll[0].toFixed(6);if(ev.dragging||drawInteraction){map.getTargetElement().style.cursor='';return}const hit=map.hasFeatureAtPixel(ev.pixel,{hitTolerance:7,layerFilter:l=>l===sicarLayer||l===searchLayer});map.getTargetElement().style.cursor=hit?'pointer':''});window.addEventListener('resize',()=>map.updateSize());updateFields();
}catch(e){console.error(e);showError('Erro ao iniciar o mapa: '+e.message)}})();
</script>
</body>
